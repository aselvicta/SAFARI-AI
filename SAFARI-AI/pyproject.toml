[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safari-ai-tanzania"
version = "2.0.0"
description = "Visitor agent for Tanzania National Parks: live official fees, park data, visas, cited answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pypdf>=5.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
safari-ai = "services.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
