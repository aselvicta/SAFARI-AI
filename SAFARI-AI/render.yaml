# Render Blueprint: PostgreSQL (pgvector) + the SafariAI API, with a disk for analytics and uploads.
# Dashboard → New → Blueprint → pick this repo. Render asks for the `sync: false` values on first apply.
# The frontend deploys to Cloudflare Pages; see "Deploy" in README.md.

databases:
  - name: safari-db
    databaseName: safari_ai
    user: safari
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    # Reachable only from Render services. The API creates the schema itself on start.
    ipAllowList: []

services:
  - type: web
    name: safari-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    healthCheckPath: /v1/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    disk:
      name: safari-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safari-db
          property: connectionString
      - key: SAFARI_STORE
        value: postgres
      - key: SAFARI_DATA_DIR
        value: /data
      - key: PORT
        value: "8000"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: SAFARI_ADMIN_USERNAME
        sync: false
      - key: SAFARI_ADMIN_PASSWORD
        sync: false
      - key: SAFARI_ADMIN_SESSION_HOURS
        value: "12"
      - key: SAFARI_SECRET_KEY
        generateValue: true
      # Copy this value into the Cloudflare Pages variable PROXY_SECRET.
      - key: SAFARI_PROXY_SECRET
        generateValue: true
      - key: SAFARI_REFRESH_HOURS
        value: "12"
      - key: SAFARI_TZS_PER_USD
        value: "2555"
